<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: thiếu nó thì env(safe-area-inset-*) luôn = 0 trên iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020817" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="agyproxy" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>agyproxy</title>
    <!--
      Đặt class theme TRƯỚC khi React chạy. Không có đoạn này thì <html> chưa có class nào
      cho tới lúc JS module tải xong → trang loé sáng rồi mới tối lại. Phải chạy đồng bộ và
      nằm trong <head>, không đưa vào main.tsx được.
      Khoá 'agy_theme' khớp hằng KEY trong src/lib/theme.ts — đổi một bên phải đổi cả hai.
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('agy_theme');
          var dark = v === 'dark' || (v !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
